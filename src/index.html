<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduGuard AI — AI-powered student dropout prediction and early intervention system for academic coordinators. Built with IBM Bob and watsonx.ai for CHARUSAT University.">
  <meta name="keywords" content="IBM Bob, AI, student dropout, CHARUSAT, watsonx, hackathon, EdTech">
  <meta name="author" content="Team EduGuard — IBM BoB AI Innovation Hackathon 2026">
  <title>EduGuard AI — Student Dropout Predictor | Powered by IBM Bob</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">

    <!-- ── Sidebar ────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🎓</div>
        <div class="brand-text">
          <div class="brand-name">EduGuard AI</div>
          <div class="brand-sub">Powered by IBM Bob</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')" href="#">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" data-view="students" onclick="navigate('students')" href="#">
          <span class="nav-icon">👥</span>
          <span class="nav-label">All Students</span>
        </a>
        <a class="nav-item" data-view="bob-ai" onclick="navigate('bob-ai')" href="#">
          <span class="nav-icon">🤖</span>
          <span class="nav-label">IBM Bob AI</span>
          <span class="nav-badge">IBM</span>
        </a>
        <a class="nav-item" data-view="analytics" onclick="navigate('analytics')" href="#">
          <span class="nav-icon">📈</span>
          <span class="nav-label">Analytics</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="coordinator-info">
          <div class="coordinator-avatar">RP</div>
          <div>
            <div class="coordinator-name">Dr. Ronak Patel</div>
            <div class="coordinator-role">CE Coordinator, CHARUSAT</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Main Content (rendered by JS) ─────────────────────── -->
    <div id="main-content" class="main"></div>

  </div>

  <!-- ── Student Detail Modal ──────────────────────────────────── -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/predictor.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
