name: Validate Submission

on: [push, pull_request]

jobs:
  validate:
    name: Validate Submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check submission.yaml exists and is valid
        run: |
          echo "Checking submission.yaml..."
          test -f submission.yaml || (echo "❌ submission.yaml is missing!" && exit 1)
          echo "✅ submission.yaml exists"
          python3 -c "
          import yaml, sys
          with open('submission.yaml') as f:
              d = yaml.safe_load(f)
          required = ['team_name', 'solution_name', 'problem_statement', 'ibm_bob_integration']
          missing = [k for k in required if not d.get(k)]
          if missing:
              print('❌ Missing required fields:', missing)
              sys.exit(1)
          print('✅ submission.yaml is valid YAML with all required fields')
          "

      - name: Check required documentation files
        run: |
          echo "Checking required docs..."
          test -f docs/setup-guide.md   || (echo "❌ docs/setup-guide.md missing!"   && exit 1)
          test -f docs/problem-statement.md || (echo "❌ docs/problem-statement.md missing!" && exit 1)
          test -f docs/solution-overview.md || (echo "❌ docs/solution-overview.md missing!" && exit 1)
          test -f docs/architecture.md  || (echo "❌ docs/architecture.md missing!"  && exit 1)
          echo "✅ All documentation files present"

      - name: Check demo files
        run: |
          echo "Checking demo files..."
          test -f demo/demo-video-link.txt || (echo "❌ demo/demo-video-link.txt missing!" && exit 1)
          test -f demo/live-demo-url.txt   || (echo "❌ demo/live-demo-url.txt missing!"   && exit 1)
          echo "✅ Demo files present"

      - name: Check source code exists
        run: |
          echo "Checking source code..."
          test -d src/ || (echo "❌ src/ directory missing!" && exit 1)
          test -f src/index.html || (echo "❌ src/index.html missing!" && exit 1)
          echo "✅ Source code present"

      - name: Check for placeholder text in README
        run: |
          echo "Checking for unfilled placeholders..."
          if grep -q '\[placeholder\]' README.md 2>/dev/null; then
            echo "❌ README.md still contains [placeholder] text"
            exit 1
          fi
          echo "✅ No placeholder text found in README.md"

      - name: Submission structure validated
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  ✅ EduGuard AI — Submission Valid!"
          echo "  Team: Team EduGuard"
          echo "  Problem: E1 — Student Dropout Predictor"
          echo "  IBM Bob: Genuinely integrated"
          echo "════════════════════════════════════════"
